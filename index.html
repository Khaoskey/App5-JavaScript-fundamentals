<!DOCTYPE html> 
<html>

   <head> 
      <title>Hello World</title>  
      <meta name="viewport" content="width=device-width, initial-scale=1">

	   <script>
		function countBasePairs(dnaSequence) {
			let countA = 0, countT = 0, countG = 0, countC = 0;
				    
			for (let base of dnaSequence) {
				if (base === 'A') countA++;
				else if (base === 'T') countT++;
				else if (base === 'G') countG++;
				else if (base === 'C') countC++;
			}
				    
			let total = countA + countT + countG + countC;
    			let percentA = ((countA / total) * 100).toFixed(2);
    			let percentT = ((countT / total) * 100).toFixed(2);
    			let percentG = ((countG / total) * 100).toFixed(2);
    			let percentC = ((countC / total) * 100).toFixed(2);
    
    			return `A count: ${countA} (${percentA}%) C count: ${countC} (${percentC}%) G count: ${countG} (${percentG}%) T count: ${countT} (${percentT}%)`;
		}
		function displayResult() {
            	let dnaSequence = "ACTGGAAGCACGGCGGCATCGTGGGCGTGCTGGGTTATGGTGGAGGCGTCATCGGCCGCTATTGCGACCGGCCGGACCTCTTCCCAGAAGTGGCCCACTTTCACACCATGCGCATCAACCAGCCCTCGAGCAAGTTTTACAATACCGACATCCTGAAAAGACTCCGTGAACTGTGGGAAAGGCGCGGCAGCGGCCTCACCAACATGCATGGTTCAACGGGGGACATCATCCTGCTCGGTACCACCACCAATGAACTGGAGCCCATATTCTATGAATTGACCCACGATTTGAATATGGACCTGGGCGGTTCGGGCTCCAACTTGCGCACACCGAGCTGCTGTCTGGGCAAGGCCCGTTGCGAGTGGTCCTGCCTTGACACTCAGGCCATCACCAACGACATTACCCATGAGTTCCAGGACGAGCCTTATCGACCCGCCTTTCCTTACAAGTTCAAGTTCAAGACCTCCGGCTGCCCCAACGACTGTGTGGCCGCCATTGCCCGGGCCGACTGCTCCATCATCGGCACCTGGCGCGATCAGATCCGCATCGACCAGGAGGCTGTAAAGGCCTACGCTGCCGGGGAACTGGCCCCCAACGGCAATGCCTTCGATACGGGACCAAGTGCTCTGGACATCCAGAAAGAGGTCTGTGACCTGTGCCCCACCCGTTGCATGGAATGGGACGGCAAGACCCTGAAATCTGGGGATGAAGAGTGCAC";
            
            	let resultText = document.getElementById("results");
            		resultText.innerHTML = countBasePairs(dnaSequence);
        	}

       		window.onload = displayResult; // Run when the page loads
	   </script>
   </head>
